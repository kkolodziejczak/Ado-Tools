name: Release

# Pushing a tag such as v1.2.0 builds, tests and checks every tool package at that version with
# the CI workflow, then stages them on nuget.org once the "release" environment is approved.
# nuget.org trusts this file through a Trusted Publishing policy, so no API key is stored here.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on master."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Exchange the GitHub token for a short-lived nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Staged packages stay private until they are published on nuget.org by hand. The upload
      # follows the PackageStaging/1.0.0 contract, which the .NET 10 SDK has no command for yet.
      - name: Stage on nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          endpoint=$(curl --fail --silent --show-error https://api.nuget.org/v3/index.json \
            | jq -r '[.resources[] | select(."@type" == "PackageStaging/1.0.0")][0]."@id" // empty')
          if [ -z "$endpoint" ]; then
            echo "::error::nuget.org does not advertise PackageStaging/1.0.0."
            exit 1
          fi
          for package in packages/*.nupkg; do
            echo "Staging $(basename "$package")"
            curl --fail-with-body --silent --show-error --max-time 300 -X PUT \
              -H "X-NuGet-ApiKey: $NUGET_API_KEY" \
              -F "package=@$package;type=application/octet-stream" \
              "${endpoint%/}/package"
            echo
          done
