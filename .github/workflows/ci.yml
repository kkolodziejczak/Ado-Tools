name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked dependencies
        run: |
          dotnet restore src/AdoRead.Cli/AdoRead.Cli.csproj --locked-mode
          dotnet restore tests/AdoRead.UnitTests/AdoRead.UnitTests.csproj --locked-mode
          dotnet restore tests/AdoRead.IntegrationTests/AdoRead.IntegrationTests.csproj --locked-mode
          dotnet restore tests/AdoRead.FakeHost/AdoRead.FakeHost.csproj --locked-mode

      - name: Verify formatting
        run: dotnet format AdoRead.slnx --verify-no-changes --no-restore

      - name: Build release artifacts
        run: dotnet build AdoRead.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test AdoRead.slnx --no-build --configuration Release

      - name: Pack tool
        run: dotnet pack src/AdoRead.Cli/AdoRead.Cli.csproj --no-build --configuration Release

      - name: Validate package contents
        run: |
          $package = Get-ChildItem artifacts/packages/AdoRead.Tool.0.5.0.nupkg | Select-Object -First 1
          if ($null -eq $package) { throw 'Expected ado-read package was not produced.' }
          ./scripts/Verify-ReleasePackage.ps1 -PackagePath $package.FullName

      - name: Smoke test installed package
        run: |
          $package = Get-ChildItem artifacts/packages/AdoRead.Tool.0.5.0.nupkg | Select-Object -First 1
          if ($null -eq $package) { throw 'Expected ado-read package was not produced.' }
          ./scripts/Test-ToolPackage.ps1 -PackagePath $package.FullName
