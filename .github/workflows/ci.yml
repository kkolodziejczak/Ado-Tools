name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      version:
        description: Package version to build, test, pack and upload as the "packages" artifact.
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked dependencies
        run: |
          dotnet restore src/AdoRead.Core/AdoRead.Core.csproj --locked-mode
          dotnet restore src/AdoRead.Cli/AdoRead.Cli.csproj --locked-mode
          dotnet restore src/AdoRead.PullRequests.Cli/AdoRead.PullRequests.Cli.csproj --locked-mode
          dotnet restore src/AdoRead.WorkItems.Cli/AdoRead.WorkItems.Cli.csproj --locked-mode
          dotnet restore src/AdoRead.Wiki.Cli/AdoRead.Wiki.Cli.csproj --locked-mode
          dotnet restore src/AdoRead.Sprints.Cli/AdoRead.Sprints.Cli.csproj --locked-mode
          dotnet restore src/AdoRead.Pipelines.Cli/AdoRead.Pipelines.Cli.csproj --locked-mode
          dotnet restore src/AdoWrite.Core/AdoWrite.Core.csproj --locked-mode
          dotnet restore src/AdoWrite.Cli/AdoWrite.Cli.csproj --locked-mode
          dotnet restore src/AdoWrite.PullRequests.Cli/AdoWrite.PullRequests.Cli.csproj --locked-mode
          dotnet restore src/AdoWrite.WorkItems.Cli/AdoWrite.WorkItems.Cli.csproj --locked-mode
          dotnet restore tests/AdoRead.UnitTests/AdoRead.UnitTests.csproj --locked-mode
          dotnet restore tests/AdoRead.IntegrationTests/AdoRead.IntegrationTests.csproj --locked-mode
          dotnet restore tests/AdoRead.FakeHost/AdoRead.FakeHost.csproj --locked-mode
          dotnet restore tests/AdoWrite.UnitTests/AdoWrite.UnitTests.csproj --locked-mode

      - name: Verify formatting
        run: dotnet format AdoRead.slnx --verify-no-changes --no-restore

      - name: Build release artifacts
        run: dotnet build AdoRead.slnx --no-restore --configuration Release "-p:Version=$env:PACKAGE_VERSION"

      - name: Run tests
        run: dotnet test AdoRead.slnx --no-build --configuration Release

      - name: Pack tools
        run: |
          dotnet pack src/AdoRead.Cli/AdoRead.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoRead.PullRequests.Cli/AdoRead.PullRequests.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoRead.WorkItems.Cli/AdoRead.WorkItems.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoRead.Wiki.Cli/AdoRead.Wiki.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoRead.Sprints.Cli/AdoRead.Sprints.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoRead.Pipelines.Cli/AdoRead.Pipelines.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoWrite.Cli/AdoWrite.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoWrite.PullRequests.Cli/AdoWrite.PullRequests.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/AdoWrite.WorkItems.Cli/AdoWrite.WorkItems.Cli.csproj --no-build --configuration Release "-p:Version=$env:PACKAGE_VERSION"

      - name: Validate package contents
        run: |
          $version = $env:PACKAGE_VERSION
          $tools = @(
            @{ PackageId = 'AdoRead.Tool'; CommandName = 'ado-read' },
            @{ PackageId = 'AdoRead.PullRequests.Tool'; CommandName = 'ado-read-pr' },
            @{ PackageId = 'AdoRead.WorkItems.Tool'; CommandName = 'ado-read-work-item' },
            @{ PackageId = 'AdoRead.Wiki.Tool'; CommandName = 'ado-read-wiki' },
            @{ PackageId = 'AdoRead.Sprints.Tool'; CommandName = 'ado-read-sprints' },
            @{ PackageId = 'AdoRead.Pipelines.Tool'; CommandName = 'ado-read-pipelines' },
            @{ PackageId = 'AdoWrite.Tool'; CommandName = 'ado-write' },
            @{ PackageId = 'AdoWrite.PullRequests.Tool'; CommandName = 'ado-write-pr' },
            @{ PackageId = 'AdoWrite.WorkItems.Tool'; CommandName = 'ado-write-work-item' }
          )
          foreach ($tool in $tools) {
            $package = Get-ChildItem "artifacts/packages/$($tool.PackageId).$version.nupkg" | Select-Object -First 1
            if ($null -eq $package) { throw "Expected $($tool.PackageId) package was not produced." }
            ./scripts/Verify-ReleasePackage.ps1 -PackagePath $package.FullName -PackageId $tool.PackageId -PackageVersion $version
            if ($LASTEXITCODE -ne 0) { throw "Package validation failed for $($tool.PackageId)." }
          }

      # NuGet Package Explorer's checks: Source Link, deterministic binaries, compiler flags.
      # The tool exits 0 even when a check fails, so the report is read instead.
      - name: Check package health
        run: |
          $failed = @()
          foreach ($package in Get-ChildItem "artifacts/packages/*.$env:PACKAGE_VERSION.nupkg") {
            $report = dnx dotnet-validate --version 0.0.1-preview.582 --yes -- package local $package.FullName | Out-String
            Write-Host $report
            if ($LASTEXITCODE -ne 0 -or $report -match '❌|Non deterministic|Invalid|Missing') { $failed += $package.Name }
          }
          if ($failed.Count -gt 0) { throw "Package health checks failed: $($failed -join ', ')" }

      - name: Smoke test installed packages
        run: |
          $version = $env:PACKAGE_VERSION
          $tools = @(
            @{ PackageId = 'AdoRead.Tool'; CommandName = 'ado-read' },
            @{ PackageId = 'AdoRead.PullRequests.Tool'; CommandName = 'ado-read-pr' },
            @{ PackageId = 'AdoRead.WorkItems.Tool'; CommandName = 'ado-read-work-item' },
            @{ PackageId = 'AdoRead.Wiki.Tool'; CommandName = 'ado-read-wiki' },
            @{ PackageId = 'AdoRead.Sprints.Tool'; CommandName = 'ado-read-sprints' },
            @{ PackageId = 'AdoRead.Pipelines.Tool'; CommandName = 'ado-read-pipelines' },
            @{ PackageId = 'AdoWrite.Tool'; CommandName = 'ado-write' },
            @{ PackageId = 'AdoWrite.PullRequests.Tool'; CommandName = 'ado-write-pr' },
            @{ PackageId = 'AdoWrite.WorkItems.Tool'; CommandName = 'ado-write-work-item' }
          )
          foreach ($tool in $tools) {
            $package = Get-ChildItem "artifacts/packages/$($tool.PackageId).$version.nupkg" | Select-Object -First 1
            if ($null -eq $package) { throw "Expected $($tool.PackageId) package was not produced." }
            ./scripts/Test-ToolPackage.ps1 -PackagePath $package.FullName -PackageId $tool.PackageId -CommandName $tool.CommandName -PackageVersion $version
            if ($LASTEXITCODE -ne 0) { throw "Smoke test failed for $($tool.PackageId)." }
          }

      - name: Upload packages for the release
        if: inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.${{ inputs.version }}.nupkg
          if-no-files-found: error
