name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      version:
        description: Package version to build, test, pack and upload as the "packages" artifact.
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # One script runs every check, so an agent or a person can run exactly the same thing before pushing.
      - name: Restore, format, build, test, pack, validate and smoke-test
        run: ./scripts/Invoke-CiChecks.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages for the release
        if: inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.${{ inputs.version }}.nupkg
          if-no-files-found: error
